<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaqshCAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

    <div id="app-container">
        <header id="app-header">
            <h1>NaqshCAD</h1>
            <div id="header-actions">
                <div class="dropdown"><button id="file-menu-btn" class="header-btn">File</button><div id="file-menu-dropdown" class="dropdown-content"><a href="#" id="new-btn">New Canvas</a><a href="#" id="save-btn">Save Project</a><a href="#" id="load-btn">Load Project</a><a href="#" id="import-dxf-btn">Import DXF...</a><hr><a href="#" id="export-btn">Export Image...</a><a href="#" id="export-dxf-btn">Export as DXF</a></div></div>
                <button id="theme-toggle-btn" class="header-btn" title="Toggle Theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg></button>
                <button id="undo-btn" class="header-btn" title="Undo (Ctrl+Z)" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" /></svg></button>
                <button id="redo-btn" class="header-btn" title="Redo (Ctrl+Y)" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l4 -4l-4 -4" /><path d="M19 10h-11a4 4 0 1 0 0 8h1" /></svg></button>
                <button id="panel-toggle-btn" class="header-btn" title="Toggle Panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M15 4l0 16" /></svg></button>
                <input type="file" id="file-input" accept=".gncad" class="hidden">
                <input type="file" id="dxf-file-input" accept=".dxf" class="hidden">
            </div>
        </header>

        <div id="ruler-corner"></div>
        <div id="ruler-top-container"><canvas id="ruler-top"></canvas></div>
        <div id="ruler-left-container"><canvas id="ruler-left"></canvas></div>
        
        <aside id="left-toolbar">
            <button class="tool-btn" id="select-tool-btn" title="Select (V)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5" /><path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5" /><path d="M14 5.5a1.5 1.5 0 0 1 3 0v6.5" /><path d="M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg></button>
            <div id="wall-tool-container">
                <button class="tool-btn" id="wall-tool-btn" title="Draw Wall (L)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M16 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M7.5 16.5l9 -9" /></svg></button>
                <div id="wall-thickness-selector" class="hidden"><div class="thickness-option" data-thickness="2"></div><div class="thickness-option active" data-thickness="5"></div><div class="thickness-option" data-thickness="10"></div></div>
            </div>
            <button class="tool-btn" id="rect-tool-btn" title="Draw Room (R)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /></svg></button>
            <button class="tool-btn" id="door-tool-btn" title="Place Door (P)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12v.01" /><path d="M3 21h18" /><path d="M6 21v-16a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v16" /></svg></button>
            <button class="tool-btn" id="window-tool-btn" title="Place Window (W)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3.866 0 -7 3.272 -7 7v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1 -1v-10c0 -3.728 -3.134 -7 -7 -7" /><path d="M5 13l14 0" /><path d="M12 3l0 18" /></svg></button>
            <button class="tool-btn" id="stairs-tool-btn" title="Draw Stairs (S)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5h-5v5h-5v5h-5v5h-5" /></svg></button>
            <button class="tool-btn" id="mirror-tool-btn" title="Mirror (M)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l0 18" /><path d="M16 7l0 10l5 0l-5 -10" /><path d="M8 7l0 10l-5 0l5 -10" /></svg></button>
            <button class="tool-btn" id="offset-tool-btn" title="Offset (O)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" /><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" /></svg></button>
            <button class="tool-btn" id="trim-tool-btn" title="Trim (T)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M3 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M8.6 8.6l10.4 10.4" /><path d="M8.6 15.4l10.4 -10.4" /></svg></button>
            <button class="tool-btn" id="dimension-tool-btn" title="Dimension (D)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4l-14 14l-4 -4l14 -14" /><path d="M16 7l-1.5 -1.5" /><path d="M13 10l-1.5 -1.5" /><path d="M10 13l-1.5 -1.5" /><path d="M7 16l-1.5 -1.5" /></svg></button>
            <button class="tool-btn" id="measure-tool-btn" title="Quick Measure (Q)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.875 12c.621 0 1.125 .512 1.125 1.143v5.714c0 .631 -.504 1.143 -1.125 1.143h-15.875a1 1 0 0 1 -1 -1v-5.857c0 -.631 .504 -1.143 1.125 -1.143h15.75" /><path d="M9 12v2" /><path d="M6 12v3" /><path d="M12 12v3" /><path d="M18 12v3" /><path d="M15 12v2" /><path d="M3 3v4" /></svg></button>
            <button class="tool-btn" id="array-tool-btn" title="Array Copy"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M18 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M4 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M18 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg></button>
            <button class="tool-btn" id="text-tool-btn" title="Text (X)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3 0" /><path d="M14 20l7 0" /><path d="M6.9 15l6.9 0" /><path d="M10.2 6.3l5.8 13.7" /><path d="M5 20l6 -16l2 0l7 16" /></svg></button>
            <button class="tool-btn" id="asset-tool-btn" title="Place Furniture (A)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11a2 2 0 0 1 2 2v2h10v-2a2 2 0 1 1 4 0v4a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-4a2 2 0 0 1 2 -2" /><path d="M5 11v-5a3 3 0 0 1 3 -3h8a3 3 0 0 1 3 3v5" /><path d="M6 19v2" /><path d="M18 19v2" /></svg></button>
        </aside>

        <main id="canvas-container">
            <canvas id="gn-canvas"></canvas>
            <canvas id="crosshair-canvas"></canvas>
        </main>

        <div id="panel-backdrop"></div>
        <aside id="right-panel">
            <div id="layers-panel">
                <div class="panel-heading-row"><h3>Layers</h3><button id="add-layer-btn" title="Add Layer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg></button></div>
                <ul id="layer-list">
                <li class="layer-item" data-layer="walls"><span>Walls</span><span class="visibility-toggle" data-visible="true"></span></li>
                <li class="layer-item" data-layer="furniture"><span>Furniture</span><span class="visibility-toggle" data-visible="true"></span></li>
                <li class="layer-item" data-layer="dimensions"><span>Dimensions</span><span class="visibility-toggle" data-visible="true"></span></li>
                <li class="layer-item" data-layer="annotations"><span>Annotations</span><span class="visibility-toggle" data-visible="true"></span></li>
                </ul>
            </div>
            <div id="properties-panel"><h3>Properties</h3><div id="panel-content"><div id="panel-content-placeholder">Select an object.</div></div></div>
            <div id="asset-panel-container" class="hidden"><h3>Assets</h3><div id="asset-list"></div></div>
        </aside>

        <footer id="status-bar">
            <div id="coords-display">X: 0.00, Y: 0.00</div>
            <div id="tool-tip"></div>
            <div id="status-bar-controls">
                <button id="pan-btn" class="status-bar-btn" title="Pan Canvas"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5" /><path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5" /><path d="M14 5.5a1.5 1.5 0 0 1 3 0v6.5" /><path d="M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47" /></svg></button>
                <button id="zoom-out-btn" class="status-bar-btn" title="Zoom Out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M7 10l6 0" /><path d="M21 21l-6 -6" /></svg></button>
                <div id="zoom-display">Zoom: 100%</div>
                <button id="zoom-in-btn" class="status-bar-btn" title="Zoom In"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M7 10l6 0" /><path d="M10 7l0 6" /><path d="M21 21l-6 -6" /></svg></button>
            </div>
            <div class="toggle-container"><input type="checkbox" id="show-rulers-checkbox" checked><label for="show-rulers-checkbox">Show Rulers</label></div>
            <div class="toggle-container" id="snap-toggle"><input type="checkbox" id="snap-checkbox" checked><label for="snap-checkbox">Snap to Grid</label></div>
            <div class="toggle-container" id="object-snap-toggle"><input type="checkbox" id="object-snap-checkbox" checked><label for="object-snap-checkbox">Object Snap</label></div>
        </footer>
    </div>

    <div id="export-modal-overlay" class="hidden"></div>
    <div id="export-modal" class="hidden">
        <div class="modal-header"><h2>Export Image</h2><button id="close-modal-btn">&times;</button></div>
        <div class="modal-body">
            <div class="prop-item"><label>Format</label><div class="radio-group"><input type="radio" id="format-png" name="format" value="png" checked><label for="format-png">PNG</label><input type="radio" id="format-jpg" name="format" value="jpeg"><label for="format-jpg">JPG</label></div></div>
            <div class="prop-item"><label for="export-scale">Resolution Scale</label><input type="number" id="export-scale" value="2" min="1" max="10"></div>
            <div class="prop-item" id="quality-wrapper" style="display: none;"><label for="export-quality">JPG Quality (0.1 - 1.0)</label><input type="number" id="export-quality" value="0.9" min="0.1" max="1.0" step="0.1"></div>
        </div>
        <div class="modal-footer"><button id="download-btn" class="action-btn">Download</button></div>
    </div>

    <div id="array-modal-overlay" class="hidden"></div>
    <div id="array-modal" class="hidden">
        <div class="modal-header"><h2>Array Copy</h2><button id="close-array-modal-btn">&times;</button></div>
        <div class="modal-body">
            <div class="radio-group array-type-tabs"><input type="radio" id="array-type-linear" name="array-type" value="linear" checked><label for="array-type-linear">Linear</label><input type="radio" id="array-type-polar" name="array-type" value="polar"><label for="array-type-polar">Polar</label></div>
            <div id="array-linear-fields">
                <div class="prop-item"><label for="array-linear-count">Count</label><input type="number" id="array-linear-count" value="3" min="2" max="50"></div>
                <div class="prop-item"><label for="array-direction">Direction</label><select id="array-direction"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></div>
                <div class="prop-item"><label for="array-spacing">Spacing (m)</label><input type="number" id="array-spacing" value="1" min="0.1" step="0.1"></div>
            </div>
            <div id="array-polar-fields" class="hidden">
                <div class="prop-item"><label for="array-polar-count">Count</label><input type="number" id="array-polar-count" value="6" min="2" max="50"></div>
                <div class="prop-item"><label for="array-polar-radius">Radius (m)</label><input type="number" id="array-polar-radius" value="1.5" min="0.1" step="0.1"></div>
                <div class="prop-item"><label for="array-polar-angle">Total Angle (°)</label><input type="number" id="array-polar-angle" value="360" min="1" max="360"></div>
            </div>
        </div>
        <div class="modal-footer"><button id="array-apply-btn" class="action-btn">Apply</button></div>
    </div>
    
    <script src="lib/fabric.min.js"></script>
    <script src="lib/dxf-parser.js"></script>
    <script src="lib/clipper.min.js"></script>
    <script src="js/dxf-exporter.js"></script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
